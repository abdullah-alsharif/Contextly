# Dev compose stack. All service env reads from .env / shell with dev-safe
# fallbacks (${VAR:-default}), so the real-mode switch (docs/local-dev.md §5)
# works by setting values in .env — no compose edits needed.
x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgresql://contextly:contextly@db:5432/contextly}
  AI_PROVIDER: ${AI_PROVIDER:-fake}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
  LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-/data/storage}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-documents}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
  AUTH_MODE: ${AUTH_MODE:-dev}
  APP_ENV: ${APP_ENV:-dev}
  DEV_JWT_SECRET: ${DEV_JWT_SECRET:-contextly-dev-secret-0123456789abcdef}
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
  SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
  JWT_LEEWAY_SECONDS: ${JWT_LEEWAY_SECONDS:-30}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
  WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-300}
  WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-3}
  WORKER_RETRY_BACKOFF_SECONDS: ${WORKER_RETRY_BACKOFF_SECONDS:-1,5,30}
  CHUNK_SIZE_TOKENS: ${CHUNK_SIZE_TOKENS:-500}
  CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-50}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
  AI_EMBED_RETRIES: ${AI_EMBED_RETRIES:-3}
  AI_EMBED_RETRY_BACKOFF_SECONDS: ${AI_EMBED_RETRY_BACKOFF_SECONDS:-1,2,4}
  NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
  NVIDIA_EMBEDDINGS_URL: ${NVIDIA_EMBEDDINGS_URL:-https://integrate.api.nvidia.com/v1/embeddings}
  NVIDIA_CHAT_URL: ${NVIDIA_CHAT_URL:-https://integrate.api.nvidia.com/v1/chat/completions}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_EMBEDDINGS_URL: ${OPENROUTER_EMBEDDINGS_URL:-https://openrouter.ai/api/v1/embeddings}
  OPENROUTER_CHAT_URL: ${OPENROUTER_CHAT_URL:-https://openrouter.ai/api/v1/chat/completions}
  RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-6}
  RETRIEVAL_EF_SEARCH: ${RETRIEVAL_EF_SEARCH:-40}
  RAG_QUERY_MAX_CHARS: ${RAG_QUERY_MAX_CHARS:-4000}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: contextly
      POSTGRES_PASSWORD: contextly
      POSTGRES_DB: contextly
    volumes:
      - db-data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextly"]
      interval: 2s
      timeout: 2s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-env
    volumes:
      - ./backend:/app
      - ./infrastructure:/app/infrastructure
      - storage-data:/data/storage
    ports: ["8000:8000"]
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-env
    volumes:
      - ./backend:/app
      - ./infrastructure:/app/infrastructure
      - storage-data:/data/storage
    command: python -m app.worker
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
      - ./frontend/proxy.ts:/app/proxy.ts
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
    ports: ["3000:3000"]
    depends_on:
      - backend

volumes:
  storage-data:
  db-data:
