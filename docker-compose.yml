# Dev compose stack. All service env reads from .env / shell with dev-safe
# fallbacks (${VAR:-default}), so the real-mode switch (docs/local-dev.md §5)
# works by setting values in .env — no compose edits needed.
x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgresql://contextly:contextly@db:5432/contextly}
  AI_PROVIDER: ${AI_PROVIDER:-fake}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
  LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-/data/storage}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-documents}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
  AUTH_MODE: ${AUTH_MODE:-dev}
  APP_ENV: ${APP_ENV:-dev}
  DEV_JWT_SECRET: ${DEV_JWT_SECRET:-contextly-dev-secret-0123456789abcdef}
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
  SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
  JWT_LEEWAY_SECONDS: ${JWT_LEEWAY_SECONDS:-30}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
  WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-300}
  WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-3}
  WORKER_RETRY_BACKOFF_SECONDS: ${WORKER_RETRY_BACKOFF_SECONDS:-1,5,30}
  CHUNK_SIZE_TOKENS: ${CHUNK_SIZE_TOKENS:-500}
  CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-50}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: contextly
      POSTGRES_PASSWORD: contextly
      POSTGRES_DB: contextly
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextly"]
      interval: 2s
      timeout: 2s
      retries: 10

  backend:
    build: ./backend
    environment: *backend-env
    volumes:
      - ./backend:/app
      - ./infrastructure:/app/infrastructure
      - storage-data:/data/storage
    ports: ["8000:8000"]
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    environment: *backend-env
    volumes:
      - ./backend:/app
      - ./infrastructure:/app/infrastructure
      - storage-data:/data/storage
    command: python -m app.worker
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on:
      - backend

volumes:
  storage-data:
