[project]
name = "contextly-backend"
version = "0.1.0"
description = "Contextly RAG backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "pydantic-settings>=2.15.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "pyjwt[crypto]>=2.13.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "pypdf>=6.16.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Third-party deprecation from starlette's TestClient ("install httpx2") —
# our test stack pins httpx; not actionable without a dependency change.
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
strict = true
python_version = "3.11"