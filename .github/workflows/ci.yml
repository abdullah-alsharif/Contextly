name: CI

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - infrastructure/migrations/**
      - eval/**
      - frontend/**
      - .github/workflows/**
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - infrastructure/migrations/**
      - eval/**
      - frontend/**
      - .github/workflows/**

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    env:
      DATABASE_URL: postgresql://postgres:${{ secrets.CI_DB_PASSWORD || 'postgres' }}@localhost:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'postgres' }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.lock
      - name: Ruff check
        working-directory: backend
        run: |
          ruff check app tests
          ruff check --config pyproject.toml ../eval
      - name: Mypy check
        working-directory: backend
        run: mypy app
      - name: Apply migrations
        # Fresh Postgres service; run from root so infrastructure/migrations resolves.
        run: PYTHONPATH=backend python -m app.migrate
      - name: Pytest
        working-directory: backend
        run: |
          mkdir -p ../test-results
          pytest -q --junitxml=../test-results/backend.xml
      - name: Security matrix (must be 10/10)
        # Hard count gate so the isolation matrix can never silently shrink.
        working-directory: backend
        run: |
          set -euo pipefail
          count=$(pytest tests/security/test_multi_tenancy_matrix.py --collect-only -q | grep -c '::')
          echo "matrix tests collected: ${count}"
          test "${count}" = "10"
          pytest tests/security/test_multi_tenancy_matrix.py -q
      - name: RAG eval (hermetic gate, recall@6 ≥ 0.85)
        # Hermetic offline harness, AI_PROVIDER=fake; exit code carries the gate.
        working-directory: ${{ github.workspace }}
        env:
          APP_ENV: dev
          AI_PROVIDER: fake
        run: |
          python -m eval.run_eval --out eval/reports/rag-eval.md
          python -m pytest eval/tests -q
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            test-results/
            eval/reports/rag-eval.md
          if-no-files-found: ignore

  frontend:
    name: Frontend (tsc + eslint + audit + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Security headers
        working-directory: frontend
        run: npm run security:check
      - name: Build
        working-directory: frontend
        run: npm run build
