name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Ruff check
        working-directory: backend
        run: ruff check app tests
      - name: Mypy check
        working-directory: backend
        run: mypy app
      - name: Apply migrations
        # DB-gated tests (and the Phase 9 matrix) need the schema; the CI
        # Postgres service is fresh (docs/testing.md §1, docs/deployment.md §4).
        # Run from the checkout root so `migrations_dir` (infrastructure/migrations)
        # resolves, with PYTHONPATH exposing the `app` package.
        run: PYTHONPATH=backend python -m app.migrate
      - name: Pytest
        working-directory: backend
        run: pytest -q
      - name: Security matrix (must be 10/10)
        # Phase 9 DoD (docs/roadmap.md, docs/testing.md §3): the tenant-isolation
        # matrix collects exactly 10 tests and all pass — the count is a hard gate
        # so the matrix can never silently shrink. Count by test-node lines
        # (`::`), robust against pytest footer/warning text. The other security
        # tests already ran in the `pytest -q` step above.
        working-directory: backend
        run: |
          set -euo pipefail
          count=$(pytest tests/security/test_multi_tenancy_matrix.py --collect-only -q | grep -c '::')
          echo "matrix tests collected: ${count}"
          test "${count}" = "10"
          pytest tests/security/test_multi_tenancy_matrix.py -q
      - name: RAG eval (hermetic gate, recall@6 ≥ 0.85)
        # Phase 10 DoD (docs/roadmap.md): recall@6 ≥ 0.85 on the committed
        # fixtures, gating BOTH the document and page-coverage variants
        # (docs/testing.md §6 — page coverage drops to ~0.4 for content-blind
        # ranking, so it carries the discriminating signal). Hermetic offline
        # harness: deterministic lexical embeddings for AI_PROVIDER=fake, no
        # DB/network/keys — the harness exit code carries the gate, and the
        # eval unit tests re-check fixtures + determinism below.
        working-directory: ${{ github.workspace }}
        env:
          APP_ENV: dev
          AI_PROVIDER: fake
        run: |
          ruff check --config backend/pyproject.toml eval
          python -m eval.run_eval --out eval/reports/rag-eval.md
          python -m pytest eval/tests -q

  frontend:
    name: Frontend (tsc + eslint + next build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npx eslint .
      - name: Security headers
        # Phase 9: CSP (+frame-ancestors), nosniff, X-Frame-Options verified
        # against the actual next.config (docs/security.md §5, docs/deployment.md §5).
        working-directory: frontend
        run: npm run security:check
      - name: Build
        working-directory: frontend
        run: npx next build